[project]
name = "netsim"
version = "2.0.0"
description = "Virtual network labs with traffic shaping for testing networked programs"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
authors = [{ name = "Eduardo Correia" }]
keywords = ["network", "emulation", "netem", "traffic-shaping", "namespaces", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/99ecarvalho/netsim_v2"
Documentation = "https://github.com/99ecarvalho/netsim_v2/blob/main/doc/MANUAL.md"
Issues = "https://github.com/99ecarvalho/netsim_v2/issues"
Changelog = "https://github.com/99ecarvalho/netsim_v2/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
netsim = "netsim.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netsim*"]

[tool.setuptools.package-data]
netsim = ["web/**/*", "defaults/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
