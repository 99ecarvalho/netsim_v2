title: Flaky cellular
description: >
  3G that keeps dropping to EDGE and losing coverage: the realistic version of
  "it works on my desk".
category: dynamic
extends: 3g-umts
timeline:
  loop: true
  steps:
    - {duration: 40s, label: 3g}
